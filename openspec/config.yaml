schema: spec-driven

context: |
  LiReader — это современная, быстрая и эстетичная мобильная читалка для Android на Flutter и SQLite.
  Ключевые принципы разработки и контекст проекта:
  - Язык: Все артефакты OpenSpec (proposal, design, tasks) составляются на русском языке.
  - Контроль качества: Перед завершением любой задачи обязательно выполнение `dart analyze lib` (строго 0 предупреждений и ошибок) и прохождение всех тестов `flutter test`.
  - Память и производительность: Для любых фоновых изображений и обложек обязателен ResizeImage во избежание переполнения GPU/RAM и черных экранов.
  - Надежное хранение: Пользовательские данные, кастомные фоны, закладки и цитаты сохраняются в постоянную директорию приложения (не во временный кэш).
  - Git-дисциплина: Trunk-based workflow (ветка main) с Conventional Commits и версионированием SemVer (vX.Y.Z).

rules:
  proposal:
    - Четко фиксировать бизнес-цель и пользовательские сценарии
    - Обязательно указывать границы задачи (Scope и Out of Scope)
  tasks:
    - Разбивать реализацию на проверяемые атомарные шаги с чекбоксами [ ]
